# bind address, use empty string to bind to all interfaces
bind_address=""
# backend listen port
listen_port=8989
# change the base URL
# url_base="/librespeed"
# proxy protocol port, use 0 to disable
proxyprotocol_port=0

# assets directory path, defaults to `assets` in the same directory
assets_path=""

# ISP lookup API, {ip} is replaced with the client's IP; set to "" to disable lookups.
# The response must be JSON with "ip", "city", "country", "iso_code" and "org" fields.
ip_lookup_url="https://ip.sprytnyk.dev/api/ip/{ip}/"

# password for logging into statistics page
statistics_password="PASSWORD"
# redact IP addresses
redact_ip_addresses=false
# obfuscate test IDs returned to clients
enable_id_obfuscation=false

# database type for statistics data, currently supports: none, memory, bolt, mysql, postgresql, sqlite, mssql
# if none is specified, no telemetry/stats will be recorded, and no result PNG will be generated
database_type="memory"
# for mysql, use "tcp(host:port)" or "unix(/path/to/mysqld.sock)" instead of a bare hostname
database_hostname=""
database_name=""
database_username=""
database_password=""
# database port (optional, defaults to driver default)
database_port=""

# if you use `bolt` as database, set database_file to database file location
# if you use `sqlite` as database, set database_file to database file location
database_file="speedtest.db"

# TLS and HTTP/2 settings. TLS is required for HTTP/2
enable_tls=false
enable_http2=false

# if you use HTTP/2 or TLS, you need to prepare certificates and private keys
# tls_cert_file="cert.pem"
# tls_key_file="privkey.pem"
