version: 2
project_name: 'speedtest-go'
#dist: ./out
before:
  hooks:
    - go mod download
builds:
  - main: ./main.go
    id: speedtest-backend
    binary: speedtest-backend
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -w -s -X main.version={{ .Version }}
    goos:
      - linux
      - windows
      - darwin
      - freebsd
    goarch:
      - 386
      - amd64
      - arm
      - arm64
    goarm:
      - 5
      - 6
      - 7
    ignore:
      # Go dropped windows/arm (32-bit) in 1.26
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: 386
      - goos: darwin
        goarch: arm
      - goos: freebsd
        goarch: 386
      - goos: freebsd
        goarch: arm
archives:
  - format_overrides:
      - goos: windows
        formats: zip
    files:
      - README.md
      - LICENSE
      - settings.toml
checksum:
  name_template: 'checksums.txt'
changelog:
  disable: false
  sort: asc
release:
  github:
    owner: sprytnyk
    name: speedtest-go
  disable: false
