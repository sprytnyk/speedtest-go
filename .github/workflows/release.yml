name: Release builds
on:
  push:
    # Build the archives for every version tag.
    tags: [ 'v*.*.*' ]
  # Or for any branch or tag from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version comes from the latest tag.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release builds start from a clean cache.
          cache: false

      - name: Test
        run: go test ./...

      - name: Build archives
        id: build
        run: scripts/build-release.sh dist

      - name: Upload archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speedtest-go_${{ steps.build.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          # The archives are compressed already.
          compression-level: 0
          retention-days: 90
